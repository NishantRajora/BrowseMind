<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BrowseMind Settings</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>BrowseMind</h1>
  <section id="general">
    <label>
      <input type="checkbox" id="enabled" />
      Enabled
    </label>
    <label>
      <input type="checkbox" id="tabHotkey" />
      Tab Key Trigger (Press Tab with or without selection)
    </label>
    <label>
      Theme:
      <select id="theme">
        <option value="system">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </label>
    <label>
      Response style:
      <select id="responseStyle">
        <option value="keypoints">Key Points Only (No Extra Text)</option>
        <option value="concise">Concise</option>
        <option value="normal">Normal</option>
        <option value="detailed">Detailed</option>
      </select>
    </label>
    <label>
      Panel Position:
      <select id="panelPosition">
        <option value="left">Left Side (Stealth)</option>
        <option value="right">Right Side</option>
      </select>
    </label>
    <label>
      Font Size (px):
      <input type="number" id="fontSize" min="9" max="28" value="13" />
    </label>
    <label>
      Transparency / Opacity:
      <input type="range" id="panelOpacity" min="15" max="100" value="80" />
      <span id="opacityVal">80%</span>
    </label>
    <label>
      Debug mode:
      <input type="checkbox" id="debugMode" />
    </label>
  </section>

  <section id="provider">
    <h2>AI Provider</h2>
    <label>
      Provider:
      <select id="providerSelect">
        <option value="ollama">Ollama</option>
        <option value="api">API Key</option>
      </select>
    </label>

    <div id="ollamaSettings" class="provider-settings">
      <label>
        Ollama URL:
        <input type="url" id="ollamaUrl" placeholder="http://localhost:11434" />
      </label>
      <label>
        API Key (optional):
        <input type="password" id="ollamaApiKey" placeholder="Bearer token (e.g. Ollama Cloud or proxy)" />
      </label>
      <label>
        Model:
        <select id="ollamaModel"></select>
      </label>
      <button id="refreshModelsBtn">Refresh Models</button>
    </div>

    <div id="apiSettings" class="provider-settings" style="display:none;">
      <label>
        Base URL:
        <input type="url" id="apiUrl" />
      </label>
      <label>
        API Key:
        <input type="password" id="apiKey" />
      </label>
      <label>
        Model:
        <input type="text" id="apiModel" />
      </label>
    </div>

    <button id="testAiBtn">Test AI</button>
    <div id="testResult" class="result"></div>
  </section>

  <script src="popup.js" type="module"></script>
</body>
</html>
